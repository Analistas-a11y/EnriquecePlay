<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Enriquecimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <!-- Supressao de aviso inofensivo de schema do Spline -->
  <script>
    (function () {
      const _origWarn = console.warn;
      console.warn = function (...args) {
        if (args.some(a => typeof a === 'string' && a.includes('updating from'))) {
          return;
        }
        _origWarn.apply(console, args);
      };
    })();
  </script>
  <!-- Spline Web Component -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.72/build/spline-viewer.js"></script>
</head>

<body class="login-fullscreen-bg">
  <!-- CSS Rain Animation Background -->
  <div class="rain-bg"></div>

  <!-- Background 3D Spline Scene (Robot covers full background) -->
  <div class="spline-fullscreen-container">
    <spline-viewer id="splineRobot" url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"></spline-viewer>
  </div>

  <!-- Robot Speech Bubble -->
  <div class="robot-speech-bubble" id="robotSpeechBubble">
    <div class="robot-speech-bubble-inner">
      <span class="robot-speech-text" id="robotSpeechText"></span>
    </div>
  </div>

  <!-- Floating Login Card Container (Floating on Left) -->
  <div class="login-floating-card">
    <div class="login-spotlight"></div>
    <div class="login-wrap">
      <div class="login-logo-container">
        <img src="{{ url_for('static', filename='estrategia-logo.png') }}" alt="Logo Estratégia"
          class="login-logo-img" />
      </div>
      <h2>Login do Sistema</h2>

      <div class="login-error" id="loginErrorBox" style="{% if not error %}display: none;{% endif %}">{{ error or '' }}</div>

      <form method="post" action="{{ url_for('login') }}" class="login-form">
        <label>
          Usuário
          <input type="text" name="username" placeholder="admin ou saf" required autocomplete="username" />
        </label>

        <label>
          Senha
          <input type="password" name="password" placeholder="Sua senha" required autocomplete="current-password" />
        </label>

        <button type="submit" class="login-button">Entrar no Sistema</button>
      </form>
    </div>
  </div>


  <!-- Script to safely inject CSS into shadowRoot to hide logo without breaking Spline internal onLoaded handlers -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const splineViewer = document.getElementById('splineRobot');
      if (splineViewer) {
        let injected = false;
        const injectCss = () => {
          if (injected) return;
          if (splineViewer.shadowRoot) {
            if (!splineViewer.shadowRoot.querySelector('#hide-spline-logo-style')) {
              const style = document.createElement('style');
              style.id = 'hide-spline-logo-style';
              style.textContent = '#logo, a[href*="spline.design"] { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }';
              splineViewer.shadowRoot.appendChild(style);
              injected = true;
              clearInterval(interval);
            }
          }
        };
        const interval = setInterval(injectCss, 100);
        injectCss();
        setTimeout(() => clearInterval(interval), 4000);
      }

      // Intercepta o envio do formulario para manter o Spline 3D continuo (sem remontagem)
      const form = document.querySelector('.login-form');
      const errBox = document.getElementById('loginErrorBox');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = form.querySelector('.login-button');
          const originalText = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Autenticando...';
          if (errBox) errBox.style.display = 'none';

          const formData = new FormData(form);
          try {
            const resp = await fetch('/login', {
              method: 'POST',
              body: formData,
              headers: {
                'X-Requested-With': 'XMLHttpRequest'
              },
              credentials: 'include'
            });
            const data = await resp.json();
            if (resp.ok && data.ok) {
              window.location.replace(data.redirect || '/');
              return;
            }
            if (errBox) {
              errBox.textContent = data.error || 'Credenciais inválidas. Verifique seu usuário e senha.';
              errBox.style.display = 'block';
            }
          } catch (err) {
            // Em caso de falha de conexao/json, fallback para envio padrao
            form.submit();
            return;
          } finally {
            btn.disabled = false;
            btn.textContent = originalText;
          }
        });
      }

      // Aguarda o Spline carregar para exibir a bolha (com fallback de 5s)
      const bubble = document.getElementById('robotSpeechBubble');
      const speechText = document.getElementById('robotSpeechText');
      const message = 'Ol\u00e1, seja bem-vindo ao programa de solicita\u00e7\u00e3o de enriquecimentos e importa\u00e7\u00f5es!';
      let charIndex = 0;
      const typingDelay = 36; // ms por caractere
      let bubbleTriggered = false;

      function startBubble() {
        if (bubbleTriggered) return;
        bubbleTriggered = true;

        // Mostra a bolha com animacao de entrada
        bubble.classList.add('is-visible');

        // Inicia o typewriter apos a animacao de entrada (0.5s)
        setTimeout(() => {
          function typeNextChar() {
            if (charIndex < message.length) {
              speechText.textContent += message[charIndex];
              charIndex++;
              setTimeout(typeNextChar, typingDelay);
            } else {
              speechText.classList.add('done');
            }
          }
          typeNextChar();
        }, 550);
      }

      // Ouve o evento de carregamento do Spline viewer
      if (splineViewer) {
        splineViewer.addEventListener('load', () => {
          // Pequena pausa apos o load para o robo aparecer na tela
          setTimeout(startBubble, 800);
        });
      }

      // Fallback: exibe de qualquer forma apos 5 segundos
      setTimeout(startBubble, 5000);
    });
  </script>

  <!-- Integracao SSO com a plataforma Estrategia OS -->
  <script>
    (function () {
      const allowedOrigins = new Set([
        'https://estrategia-os.vercel.app',
        'http://localhost:47821',
        {% if allowed_origins %}
          {% for o in allowed_origins %}
            '{{ o }}',
          {% endfor %}
        {% endif %}
      ]);

      let ssoInFlight = false;
      let ssoSuccess = false;

      window.addEventListener('message', async (event) => {
        if (!event || !event.origin || !allowedOrigins.has(event.origin)) {
          return;
        }

        if (event.data?.type !== 'AUTH_SESSION' || !event.data?.token) {
          return;
        }

        if (ssoInFlight || ssoSuccess) return;
        ssoInFlight = true;

        const token = event.data.token;

        try {
          const response = await fetch('/api/auth/sso', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ token }),
            credentials: 'include'
          });

          if (response.ok) {
            const result = await response.json();
            if (result && result.ok) {
              ssoSuccess = true;
              window.location.replace(result.redirect || '/');
              return;
            }
          }
        } catch (err) {
          // Fallback silencioso: mantem a tela de login tradicional ativa
          console.warn('SSO silencioso ignorado:', err);
        } finally {
          ssoInFlight = false;
        }
      });
    })();
  </script>
</body>

</html>
