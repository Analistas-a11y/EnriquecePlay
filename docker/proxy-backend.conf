# $backend, $backend_host e $client_ip_real vem do server{} (nginx.conf.template).
# Com variavel no proxy_pass, o caminho e a query precisam ir a mao: $request_uri leva exatamente o que o navegador pediu.
proxy_pass $backend$request_uri;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $backend_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $proto_do_cliente;
proxy_set_header X-Forwarded-Host $host;
# IP real do visitante (o backend le este cabecalho via CLIENT_IP_HEADER=X-Original-Client-IP)
proxy_set_header X-Original-Client-IP $client_ip_real;
# devtunnel (VS Code Ports) mostra uma pagina de aviso para navegadores; este cabecalho pula o aviso. Inofensivo em outros tuneis.
proxy_set_header X-Tunnel-Skip-AntiPhishing-Page "true";
proxy_ssl_server_name on;
proxy_redirect off;

# Downloads e uploads grandes: nada de guardar a resposta/requisicao no nginx
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;

proxy_connect_timeout 15s;
proxy_send_timeout 900s;
proxy_read_timeout 900s;
